# Copy to ~/.config/wrap/wrap.toml.
# Every setting is optional; an absent or empty file is valid.

walk_depth = 1
tree_side = "left"
tree_width = 25

[defaults]
# Empty starts the user's login shell. Set a trusted command such as "codex"
# when every new terminal should start it automatically.
cmd = ""

[keys]
# tmux key syntax. On macOS, M-1 means Option-1 when the terminal sends
# Option as Alt/Meta.
focus_tree = "M-2"
focus_terminal = "M-1"
focus_terms = "M-3"
