name: release

# Publishes a GitHub Release with binaries for macOS and Linux when a
# version tag is pushed. The complete reusable CI workflow runs first: a tag
# that fails either platform, lint, docs, or reproducibility checks cannot
# become a release. The public repository also protects v* tags from updates
# and deletion; publish-release.sh performs a defensive post-publish recheck.

on:
  push:
    tags: ["v[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  # Never cancel after a run may have published but before its defensive
  # post-publish tag check and rollback.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sign build provenance for the release archives via Sigstore/OIDC
      # and record the attestation on the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag-on-main ancestry check below has the
          # graph connecting the tag commit to main's tip; a shallow clone
          # cannot resolve merge-base.
          fetch-depth: 0
      # actions/checkout resolves the pushed tag to a lightweight ref, so
      # re-fetch the annotated object (and main) here. The graph validation —
      # annotated, points at HEAD, and on main so unreviewed history cannot
      # ship — lives in scripts/check-release-tag.sh, covered by
      # scripts/test-check-release-tag.sh.
      - name: validate release tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git fetch --force origin main
          tag_object=$(./scripts/check-release-tag.sh "refs/tags/${GITHUB_REF_NAME}" origin/main)
          echo "WRAP_EXPECTED_TAG_OBJECT=$tag_object" >>"$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth: the tag's go.mod pins the exact toolchain
          # (toolchain go1.26.x), so release retries and the CI gate that
          # precedes them build with the same compiler patch.
          go-version-file: go.mod
      - name: build release archives
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME" dist
      # Attest provenance for the exact archives before they are published,
      # so consumers can verify with `gh attestation verify` that these
      # binaries were built by this workflow from this commit.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/wrap_*.tar.gz
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          WRAP_EXPECTED_SHA: ${{ github.sha }}
        run: ./scripts/publish-release.sh "$GITHUB_REF_NAME" dist
