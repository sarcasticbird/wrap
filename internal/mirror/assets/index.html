<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <title>wrap mirror</title>
  <link rel="stylesheet" href="/assets/third_party/xterm/xterm.css">
  <link rel="stylesheet" href="/assets/wrap-mirror.css">
</head>
<body>
  <main id="app">
    <header class="masthead">
      <div>
        <p class="eyebrow">WRAP / ENCRYPTED MIRROR</p>
        <h1>Remote terminal</h1>
      </div>
      <span id="connection-state" class="status" aria-live="polite">Preparing</span>
    </header>

    <section id="message-view" class="panel" aria-live="polite">
      <p class="eyebrow">CONNECTION</p>
      <h2 id="message-title">Checking encryption…</h2>
      <p id="message-detail">The terminal stays locked until pairing succeeds.</p>
    </section>

    <section id="terminal-view" class="terminal-shell hidden" aria-labelledby="terminal-title">
      <div class="terminal-heading">
        <strong id="terminal-title">Terminal</strong>
        <div class="terminal-actions" role="group" aria-label="Terminal view controls">
          <button id="keyboard-toggle" type="button" aria-pressed="false">Keyboard</button>
          <button id="fit-button" type="button" aria-pressed="true">Fit</button>
          <button id="close-button" class="danger" type="button">Close</button>
        </div>
      </div>
      <div id="terminal-viewport" class="terminal-viewport">
        <div id="terminal-loading" class="terminal-loading" role="status">Opening terminal…</div>
        <output id="pinch-scale" class="pinch-scale hidden">100%</output>
        <div id="terminal-spacer" class="terminal-spacer">
          <div id="terminal-surface" class="terminal-surface">
            <div id="terminal" aria-label="Interactive remote terminal"></div>
          </div>
        </div>
      </div>
      <nav id="toolbar" class="toolbar" aria-label="Terminal keys">
        <button type="button" data-key="escape">Esc</button>
        <button type="button" data-key="tab">Tab</button>
        <button type="button" data-key="shift-tab">⇧Tab</button>
        <button type="button" data-key="control" aria-pressed="false">Ctrl</button>
        <button type="button" data-key="enter">Enter</button>
        <button type="button" data-key="left">←</button>
        <button type="button" data-key="up">↑</button>
        <button type="button" data-key="down">↓</button>
        <button type="button" data-key="right">→</button>
        <button type="button" data-key="ctrl-c">C-c</button>
        <button type="button" data-key="ctrl-d">C-d</button>
        <button type="button" data-key="ctrl-l">C-l</button>
        <button type="button" data-key="ctrl-z">C-z</button>
      </nav>
    </section>
  </main>
  <script src="/assets/wrap-mirror-bootstrap.js"></script>
</body>
</html>
